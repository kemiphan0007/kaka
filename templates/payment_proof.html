<!DOCTYPE html>
<html>
<head>
    <title>Payment Verification - MYSHOP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 40px 20px;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .notice {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5f5;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PAYMENT VERIFICATION</h1>

    <div class="subtitle">
        Submit your payment proof for order verification.
    </div>

    <form method="POST" enctype="multipart/form-data">

        <label>ORDER NUMBER</label>

        <input
            type="text"
            name="order_number"
            placeholder="Example: SN-20260923-235324"
            required
        >

        <label>PAYMENT PROOF</label>

        <input
            type="file"
            name="payment_proof"
            accept="image/*,.pdf"
            required
        >

        <button type="submit">
            SUBMIT PAYMENT PROOF
        </button>

    </form>

    <div class="notice">
        Your payment proof will be reviewed by our administration.
        Payment is not considered confirmed until verification is completed.
    </div>

</div>

</body>
</html>
