<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ke-miphan</title>

    <style>

:root{--navy:#080d19;--blue:#285cff;--blue2:#6f91ff;--ink:#111827;--muted:#667085;--line:#e6eaf2;--page:#f3f6fc;--white:#fff}
*{box-sizing:border-box}
body{margin:0;padding:28px 16px 50px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,rgba(40,92,255,.11),transparent 38rem),var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
.checkout-container{max-width:920px;margin:0 auto}
.back-link{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;color:#53617a;text-decoration:none;font-size:12px;font-weight:700}
.back-link:hover{color:var(--blue)}
.checkout-card{padding:42px;background:rgba(255,255,255,.96);border:1px solid #e3e8f1;border-radius:24px;box-shadow:0 24px 70px rgba(20,35,75,.08)}
h1{margin:0 0 9px;font-size:clamp(30px,5vw,42px);line-height:1.05;letter-spacing:-.045em;font-weight:780;color:#101828}
.subtitle{margin:0 0 32px;color:var(--muted);font-size:14px;line-height:1.7}
h2{margin:34px 0 14px;font-size:17px;font-weight:760;letter-spacing:-.02em;color:#172033}
.product-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:19px 0;border-bottom:1px solid var(--line)}
.product-name{font-weight:750;font-size:14px;color:#172033;overflow-wrap:anywhere}
.product-price{margin-top:7px;color:#738096;font-size:12px;line-height:1.6}
.quantity-controls{display:flex;align-items:center;gap:8px}
.quantity-controls button{width:34px;height:34px;border:1px solid #dce3ef;background:#fff;color:#23365f;border-radius:9px;cursor:pointer;font-size:17px;transition:.18s}
.quantity-controls button:hover{border-color:#9db4ff;background:#f2f5ff}
.quantity-value{min-width:25px;text-align:center;font-size:13px;font-weight:750}
.remove-button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;margin-left:2px;padding:0;border:1px solid #f0d6d6;border-radius:9px;background:#fff;color:#c43b3b;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.remove-button:hover{background:#fff0f0;border-color:#e6aaaa;transform:translateY(-1px)}
.remove-button svg{width:17px;height:17px;display:block}
.remove-button:focus-visible{outline:2px solid #c43b3b;outline-offset:2px}
.add-product{display:flex;gap:10px;margin-top:20px}
select,input,textarea{width:100%;padding:13px 14px;border:1px solid #dce3ef;border-radius:10px;background:#fff;color:#202b40;font:inherit;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
select:focus,input:focus,textarea:focus{border-color:#7898ff;box-shadow:0 0 0 3px rgba(40,92,255,.10)}
.add-product select{flex:1;min-width:0}
.add-button{padding:0 20px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap;transition:background .2s,transform .2s}
.add-button:hover{background:#1b2e58;transform:translateY(-1px)}
.summary{margin-top:26px;padding:23px;background:linear-gradient(135deg,#f5f7ff,#eef3ff);border:1px solid #dfe7ff;border-radius:15px}
.summary-line{display:flex;justify-content:space-between;gap:10px;margin-bottom:13px;color:#68758d;font-size:13px}
.summary-line strong{color:#273653}
.summary-total{display:flex;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid #d8e1f5;color:#14264d;font-size:20px;font-weight:850}
.form-group{margin-bottom:17px}
.form-group label{display:block;margin-bottom:8px;color:#344054;font-size:12px;font-weight:750}
textarea{min-height:110px;resize:vertical}
.submit-button{width:100%;margin-top:19px;padding:17px;border:0;border-radius:11px;background:linear-gradient(100deg,#285cff,#4778ff);color:#fff;font-size:12px;font-weight:850;letter-spacing:.12em;cursor:pointer;box-shadow:0 10px 22px rgba(40,92,255,.20);transition:transform .2s,box-shadow .2s,opacity .2s}
.submit-button:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(40,92,255,.25)}
.submit-button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.empty-cart{padding:28px 12px;color:#8993a5;text-align:center;font-size:13px;background:#fafbfe;border:1px dashed #dce3ef;border-radius:12px}
.notice{margin:19px 0 0;color:#8993a5;font-size:11px;line-height:1.7;text-align:center}
@media(max-width:650px){body{padding:14px 12px 30px}.checkout-container{width:100%}.back-link{margin:5px 0 17px}.checkout-card{padding:26px 19px;border-radius:19px}h1{font-size:29px}.subtitle{margin-bottom:25px;font-size:13px}h2{margin-top:29px;font-size:16px}.add-product{flex-direction:column}.add-button{padding:14px}.product-row{grid-template-columns:1fr;gap:12px}.quantity-controls{justify-content:flex-start}.summary{padding:19px}.summary-total{font-size:18px}}

    

/* Kemiphan Molecular Signature — subtle decorative watermark */

0cy%3D%22342%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22690%22%20cy%3D%22388%22%20r%3D%223%22%2F%3E%0A%20%3Ccircle%20cx%3D%22340%22%20cy%3D%22390%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22492%22%20cy%3D%22458%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22566%22%20cy%3D%22500%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22566%22%20cy%3D%22592%22%20r%3D%223%22%2F%3E%0A%20%3Ccircle%20cx%3D%22114%22%20cy%3D%22500%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22592%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22188%22%20cy%3D%22634%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22570%22%20cy%3D%22758%22%20r%3D%223%22%2F%3E%0A%3C%2Fg%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right -70px top 8px;
    background-size: min(88vw, 1040px) auto;
    mix-blend-mode: multiply;
}
body > * { position: relative; z-index: 1; }
@media (max-width: 700px) {
    body::after {
        opacity: 0.038;
        background-position: right -180px top 90px;
        background-size: 760px auto;
    }
}

</style>
</head>

<body>

<div class="checkout-container">

    <a href="/" class="back-link">← Back to Store</a>

    <div class="checkout-card">

        <h1>Checkout</h1>

        <p class="subtitle">
            Review your products and complete your order.
        </p>

        <h2>Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <div class="add-product">

            <select id="productSelector">
                <option value="">Select another product</option>
                <option value="R&D System PZM21 - 50g Bulk">R&amp;D System™ PZM21 - 50g Bulk ($3,700)</option>
                <option value="AT121 Research Chemical - 10g Sample">AT121 Research Chemical - 10g Sample ($900)</option>
                <option value="AT121 Research Chemical - 50g Bulk">AT121 Research Chemical - 50g Bulk ($4,100)</option>
                <option value="AT121 Research Chemical - 100g Bulk">AT121 Research Chemical - 100g Bulk ($7,000)</option>
                <option value="RO64-6198 Research Chemical - 50g Bulk">RO64-6198 Research Chemical - 50g Bulk ($5,600)</option>
                <option value="SR17018 - 50g Sample">SR17018 - 50g Sample ($350)</option>
                <option value="SR17018 - 1kg Bulk">SR17018 - 1kg Bulk ($4,650)</option>
                <option value="Moringa Powder - 100g Sample">Moringa Powder - 100g Sample ($100)</option>
                <option value="Moringa Powder - 1kg Bulk">Moringa Powder - 1kg Bulk ($750)</option>
                <option value="MIT 88% Alkaloids 97% - 100g Sample">MIT 88% - 100g Sample ($250)</option>
                <option value="MIT 88% Alkaloids 97% - 1kg Bulk">MIT 88% - 1kg Bulk ($2,050)</option>
                <option value="SR-14968 - 100g Sample">SR-14968 - 100g Sample ($500)</option>
                <option value="SR-14968 - 1kg Bulk">SR-14968 - 1kg Bulk ($4,500)</option>
            </select>

            <button
                type="button"
                class="add-button"
                onclick="addProduct()">
                + ADD
            </button>

        </div>

        <div class="summary">

            <div class="summary-line">
                <span>Total Product Types</span>
                <strong id="productCount">0</strong>
            </div>

            <div class="summary-line">
                <span>Total Quantity</span>
                <strong id="totalQuantity">0</strong>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <span id="grandTotal">$0</span>
            </div>

        </div>

        <h2>Customer Information</h2>

        <form
            id="checkoutForm"
            action="/place-order"
            method="POST"
            onsubmit="return prepareCheckout()">

            <input
                type="hidden"
                name="cart_json"
                id="cartJson">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    autocomplete="name"
                    placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="address">Shipping Address</label>
                <textarea
                    id="address"
                    name="address"
                    required
                    autocomplete="street-address"
                    placeholder="Enter your complete shipping address"></textarea>
            </div>

            <button
                type="submit"
                class="submit-button"
                id="submitButton">
                PLACE ORDER
            </button>

        </form>

        <p class="notice">
            Please review your order carefully before submitting.
            Product prices are calculated by the store server.
        </p>

    </div>

</div>

<script>

const PRODUCT_PRICES = {
    "R&D System PZM21 - 50g Bulk": 3700,
    "AT121 Research Chemical - 10g Sample": 900,
    "AT121 Research Chemical - 50g Bulk": 4100,
    "AT121 Research Chemical - 100g Bulk": 7000,
    "RO64-6198 Research Chemical - 50g Bulk": 5600,

    "SR17018 - 50g Sample": 350,
    "SR17018 - 1kg Bulk": 4650,

    "Moringa Powder - 100g Sample": 100,
    "Moringa Powder - 1kg Bulk": 750,

    "MIT 88% Alkaloids 97% - 100g Sample": 250,
    "MIT 88% Alkaloids 97% - 1kg Bulk": 2050,

    "SR-14968 - 100g Sample": 500,
    "SR-14968 - 1kg Bulk": 4500
};

let cart = [];


function formatMoney(value) {
    return "$" + Number(value).toLocaleString("en-US");
}


function addProduct() {

    const selector = document.getElementById("productSelector");
    const product = selector.value;

    if (!product || !PRODUCT_PRICES[product]) {
        alert("Please select a valid product.");
        return;
    }

    const existing = cart.find(item => item.product === product);

    if (existing) {
        existing.quantity += 1;
    } else {
        cart.push({
            product: product,
            quantity: 1
        });
    }

    selector.value = "";

    renderCart();
}


function changeQuantity(index, amount) {

    if (!cart[index]) return;

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    renderCart();
}


function removeProduct(index) {

    cart.splice(index, 1);

    renderCart();
}


function renderCart() {

    const container = document.getElementById("cartItems");

    container.innerHTML = "";

    let total = 0;
    let totalQuantity = 0;

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty-cart">
                Your cart is empty.
                Please add a product to continue.
            </div>
        `;

    }

    cart.forEach((item, index) => {

        const price = PRODUCT_PRICES[item.product];
        const subtotal = price * item.quantity;

        total += subtotal;
        totalQuantity += item.quantity;

        const row = document.createElement("div");
        row.className = "product-row";

        const details = document.createElement("div");

        const productName = document.createElement("div");
        productName.className = "product-name";
        productName.textContent = item.product;

        const priceText = document.createElement("div");
        priceText.className = "product-price";
        priceText.textContent =
            formatMoney(price) + " each · Subtotal: " +
            formatMoney(subtotal);

        details.appendChild(productName);
        details.appendChild(priceText);

        const controls = document.createElement("div");
        controls.className = "quantity-controls";

        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Decrease quantity");
        minus.addEventListener("click", () => changeQuantity(index, -1));

        const quantity = document.createElement("span");
        quantity.className = "quantity-value";
        quantity.textContent = item.quantity;

        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Increase quantity");
        plus.addEventListener("click", () => changeQuantity(index, 1));

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-button";
        remove.setAttribute("aria-label", "Remove " + item.product + " from cart");
        remove.setAttribute("title", "Remove product");
        remove.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="m19 6-1 14H6L5 6"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
            </svg>
        `;
        remove.addEventListener("click", () => removeProduct(index));

        controls.appendChild(minus);
        controls.appendChild(quantity);
        controls.appendChild(plus);
        controls.appendChild(remove);

        row.appendChild(details);
        row.appendChild(controls);

        container.appendChild(row);

    });

    document.getElementById("productCount").textContent = cart.length;

    document.getElementById("totalQuantity").textContent =
        totalQuantity;

    document.getElementById("grandTotal").textContent =
        formatMoney(total);

    document.getElementById("submitButton").disabled =
        cart.length === 0;

}


function prepareCheckout() {

    if (cart.length === 0) {
        alert("Your cart is empty.");
        return false;
    }

    const cartJson = cart.map(item => ({
        product: item.product,
        quantity: item.quantity
    }));

    document.getElementById("cartJson").value =
        JSON.stringify(cartJson);

    return true;
}


// Load initial product from the existing store link.
function loadInitialProduct() {

    const params = new URLSearchParams(window.location.search);

    const packageName = params.get("package");

    if (!packageName) {
        renderCart();
        return;
    }

    let productKey = packageName;

    if (
        !PRODUCT_PRICES[productKey] &&
        PRODUCT_PRICES[packageName + " Sample"]
    ) {
        productKey = packageName + " Sample";
    }

    if (PRODUCT_PRICES[productKey]) {

        cart.push({
            product: productKey,
            quantity: 1
        });

    } else {

        // Compatibility with links that pass only package names.
        const matching = Object.keys(PRODUCT_PRICES).find(key => {
            return key === packageName ||
                   key.endsWith(" - " + packageName);
        });

        if (matching) {
            cart.push({
                product: matching,
                quantity: 1
            });
        }

    }

    renderCart();

}


loadInitialProduct();

</script>

</body>
</html>
