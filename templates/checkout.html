<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ke-miphan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f2f4;
            color: #222;
        }

        .checkout-container {
            max-width: 850px;
            margin: 30px auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #333;
            text-decoration: none;
            font-size: 13px;
        }

        .checkout-card {
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #777;
            font-size: 14px;
        }

        h2 {
            margin: 30px 0 15px;
            font-size: 18px;
        }

        .product-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .product-name {
            font-weight: 600;
            font-size: 14px;
        }

        .product-price {
            margin-top: 6px;
            color: #777;
            font-size: 13px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-controls button {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 17px;
        }

        .quantity-value {
            min-width: 25px;
            text-align: center;
            font-size: 14px;
        }

        .remove-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-left: 4px;
            padding: 0;
            border: 1px solid #f0d6d6;
            border-radius: 7px;
            background: #fff;
            color: #c43b3b;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease, transform .2s ease;
        }

        .remove-button:hover {
            background: #fff0f0;
            border-color: #e6aaaa;
            transform: translateY(-1px);
        }

        .remove-button svg {
            width: 17px;
            height: 17px;
            display: block;
        }

        .remove-button:focus-visible {
            outline: 2px solid #c43b3b;
            outline-offset: 2px;
        }

        .add-product {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-family: inherit;
            font-size: 14px;
        }

        .add-product select {
            flex: 1;
        }

        .add-button {
            padding: 0 18px;
            border: 0;
            border-radius: 7px;
            background: #333;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .summary {
            margin-top: 25px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 9px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            font-size: 19px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            margin-top: 20px;
            padding: 17px;
            border: none;
            border-radius: 8px;
            background: #171717;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #444;
        }

        .submit-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .empty-cart {
            padding: 25px 10px;
            color: #777;
            text-align: center;
            font-size: 14px;
        }

        .notice {
            margin-top: 20px;
            color: #888;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }

        @media(max-width: 600px) {
            .checkout-card {
                padding: 22px 17px;
            }

            h1 {
                font-size: 25px;
            }

            .add-product {
                flex-direction: column;
            }

            .add-button {
                padding: 13px;
            }

            .product-row {
                grid-template-columns: 1fr;
            }

            .quantity-controls {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="checkout-container">

    <a href="/" class="back-link">← Back to Store</a>

    <div class="checkout-card">

        <h1>Checkout</h1>

        <p class="subtitle">
            Review your products and complete your order.
        </p>

        <h2>Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <div class="add-product">

            <select id="productSelector">
                <option value="">Select another product</option>
                <option value="SR17018 - 50g Sample">SR17018 - 50g Sample ($350)</option>
                <option value="SR17018 - 1kg Bulk">SR17018 - 1kg Bulk ($4,650)</option>
                <option value="Moringa Powder - 100g Sample">Moringa Powder - 100g Sample ($100)</option>
                <option value="Moringa Powder - 1kg Bulk">Moringa Powder - 1kg Bulk ($750)</option>
                <option value="Spatholobus littoralis Powder - 100g Sample">Spatholobus littoralis - 100g Sample ($250)</option>
                <option value="Spatholobus littoralis Powder - 1kg Bulk">Spatholobus littoralis - 1kg Bulk ($2,150)</option>
                <option value="MIT 88% Alkaloids 97% - 100g Sample">MIT 88% - 100g Sample ($250)</option>
                <option value="MIT 88% Alkaloids 97% - 1kg Bulk">MIT 88% - 1kg Bulk ($2,050)</option>
                <option value="SR-14968 - 100g Sample">SR-14968 - 100g Sample ($500)</option>
                <option value="SR-14968 - 1kg Bulk">SR-14968 - 1kg Bulk ($4,500)</option>
            </select>

            <button
                type="button"
                class="add-button"
                onclick="addProduct()">
                + ADD
            </button>

        </div>

        <div class="summary">

            <div class="summary-line">
                <span>Total Product Types</span>
                <strong id="productCount">0</strong>
            </div>

            <div class="summary-line">
                <span>Total Quantity</span>
                <strong id="totalQuantity">0</strong>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <span id="grandTotal">$0</span>
            </div>

        </div>

        <h2>Customer Information</h2>

        <form
            id="checkoutForm"
            action="/place-order"
            method="POST"
            onsubmit="return prepareCheckout()">

            <input
                type="hidden"
                name="cart_json"
                id="cartJson">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    autocomplete="name"
                    placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="address">Shipping Address</label>
                <textarea
                    id="address"
                    name="address"
                    required
                    autocomplete="street-address"
                    placeholder="Enter your complete shipping address"></textarea>
            </div>

            <button
                type="submit"
                class="submit-button"
                id="submitButton">
                PLACE ORDER
            </button>

        </form>

        <p class="notice">
            Please review your order carefully before submitting.
            Product prices are calculated by the store server.
        </p>

    </div>

</div>

<script>

const PRODUCT_PRICES = {
    "SR17018 - 50g Sample": 350,
    "SR17018 - 1kg Bulk": 4650,

    "Moringa Powder - 100g Sample": 100,
    "Moringa Powder - 1kg Bulk": 750,

    "Spatholobus littoralis Powder - 100g Sample": 250,
    "Spatholobus littoralis Powder - 1kg Bulk": 2150,

    "MIT 88% Alkaloids 97% - 100g Sample": 250,
    "MIT 88% Alkaloids 97% - 1kg Bulk": 2050,

    "SR-14968 - 100g Sample": 500,
    "SR-14968 - 1kg Bulk": 4500
};

let cart = [];


function formatMoney(value) {
    return "$" + Number(value).toLocaleString("en-US");
}


function addProduct() {

    const selector = document.getElementById("productSelector");
    const product = selector.value;

    if (!product || !PRODUCT_PRICES[product]) {
        alert("Please select a valid product.");
        return;
    }

    const existing = cart.find(item => item.product === product);

    if (existing) {
        existing.quantity += 1;
    } else {
        cart.push({
            product: product,
            quantity: 1
        });
    }

    selector.value = "";

    renderCart();
}


function changeQuantity(index, amount) {

    if (!cart[index]) return;

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    renderCart();
}


function removeProduct(index) {

    cart.splice(index, 1);

    renderCart();
}


function renderCart() {

    const container = document.getElementById("cartItems");

    container.innerHTML = "";

    let total = 0;
    let totalQuantity = 0;

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty-cart">
                Your cart is empty.
                Please add a product to continue.
            </div>
        `;

    }

    cart.forEach((item, index) => {

        const price = PRODUCT_PRICES[item.product];
        const subtotal = price * item.quantity;

        total += subtotal;
        totalQuantity += item.quantity;

        const row = document.createElement("div");
        row.className = "product-row";

        const details = document.createElement("div");

        const productName = document.createElement("div");
        productName.className = "product-name";
        productName.textContent = item.product;

        const priceText = document.createElement("div");
        priceText.className = "product-price";
        priceText.textContent =
            formatMoney(price) + " each · Subtotal: " +
            formatMoney(subtotal);

        details.appendChild(productName);
        details.appendChild(priceText);

        const controls = document.createElement("div");
        controls.className = "quantity-controls";

        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Decrease quantity");
        minus.addEventListener("click", () => changeQuantity(index, -1));

        const quantity = document.createElement("span");
        quantity.className = "quantity-value";
        quantity.textContent = item.quantity;

        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Increase quantity");
        plus.addEventListener("click", () => changeQuantity(index, 1));

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-button";
        remove.setAttribute("aria-label", "Remove " + item.product + " from cart");
        remove.setAttribute("title", "Remove product");
        remove.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="m19 6-1 14H6L5 6"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
            </svg>
        `;
        remove.addEventListener("click", () => removeProduct(index));

        controls.appendChild(minus);
        controls.appendChild(quantity);
        controls.appendChild(plus);
        controls.appendChild(remove);

        row.appendChild(details);
        row.appendChild(controls);

        container.appendChild(row);

    });

    document.getElementById("productCount").textContent = cart.length;

    document.getElementById("totalQuantity").textContent =
        totalQuantity;

    document.getElementById("grandTotal").textContent =
        formatMoney(total);

    document.getElementById("submitButton").disabled =
        cart.length === 0;

}


function prepareCheckout() {

    if (cart.length === 0) {
        alert("Your cart is empty.");
        return false;
    }

    const cartJson = cart.map(item => ({
        product: item.product,
        quantity: item.quantity
    }));

    document.getElementById("cartJson").value =
        JSON.stringify(cartJson);

    return true;
}


// Load initial product from the existing store link.
function loadInitialProduct() {

    const params = new URLSearchParams(window.location.search);

    const packageName = params.get("package");

    if (!packageName) {
        renderCart();
        return;
    }

    let productKey = packageName;

    if (
        !PRODUCT_PRICES[productKey] &&
        PRODUCT_PRICES[packageName + " Sample"]
    ) {
        productKey = packageName + " Sample";
    }

    if (PRODUCT_PRICES[productKey]) {

        cart.push({
            product: productKey,
            quantity: 1
        });

    } else {

        // Compatibility with links that pass only package names.
        const matching = Object.keys(PRODUCT_PRICES).find(key => {
            return key === packageName ||
                   key.endsWith(" - " + packageName);
        });

        if (matching) {
            cart.push({
                product: matching,
                quantity: 1
            });
        }

    }

    renderCart();

}


loadInitialProduct();

</script>

</body>
</html>
